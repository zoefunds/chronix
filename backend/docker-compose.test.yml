version: "3.9"
# Standalone Postgres for backend integration tests.
# Run from backend/: docker compose -f docker-compose.test.yml up -d
# Then: TEST_DATABASE_URL=postgres://echomarkets:echomarkets@localhost:5450/echomarkets_test npm test

services:
  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: echomarkets
      POSTGRES_PASSWORD: echomarkets
      POSTGRES_DB: echomarkets_test
    ports:
      - "5450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echomarkets -d echomarkets_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
