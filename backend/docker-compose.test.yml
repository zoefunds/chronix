version: "3.9"
# Standalone Postgres for backend integration tests.
# Run from backend/: docker compose -f docker-compose.test.yml up -d
# Then: TEST_DATABASE_URL=postgres://chronix:chronix@localhost:5450/chronix_test npm test

services:
  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronix
      POSTGRES_PASSWORD: chronix
      POSTGRES_DB: chronix_test
    ports:
      - "5450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronix -d chronix_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
