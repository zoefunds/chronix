version: "3.9"

# Local dev stack: Postgres + backend API.
# Run from repo root: docker compose up --build
# The backend image needs both backend/ and database/ (migrations), so the
# build context is the repo root with an explicit dockerfile path.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronix
      POSTGRES_PASSWORD: chronix
      POSTGRES_DB: chronix
    ports:
      - "5432:5432"
    volumes:
      - chronix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronix -d chronix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://chronix:chronix@postgres:5432/chronix
      DATABASE_SSL: "false"
      JWT_SECRET: dev-only-secret-change-me
      SIWE_DOMAIN: localhost
      SIWE_URI: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      CONTRACT_ADDRESS: ""
      GENLAYER_RPC_URL: https://studio.genlayer.com/api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  chronix_pgdata:
